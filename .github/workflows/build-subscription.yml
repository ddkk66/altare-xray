name: Build subscription service

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-subscription:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push subscription
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.subscription
          push: true
          tags: ghcr.io/ddkk66/altare-subscription:latest
